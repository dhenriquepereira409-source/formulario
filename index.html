<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário com SheetDB</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Cadastro de Cliente</h1>
      <p>Preencha os dados abaixo para enviar o formulário.</p>
    </div>

    <form action="https://sheetdb.io/api/v1/krolc0yud9j4d" method="post">

      <div class="input-group">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="data[nome]" placeholder="Ex: João Silva" required>
      </div>

      <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="data[email]" placeholder="Ex: joao@email.com" required>
      </div>

      <div class="input-group">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="data[telefone]" placeholder="Ex: (63) 99999-9999" required>
      </div>

      <div class="input-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="data[cpf]" placeholder="Ex: 000.000.000-00" required>
      </div>

      <div class="input-group">
        <label for="idade">Idade</label>
        <input type="number" id="idade" name="data[idade]" placeholder="Ex: 25" min="1" required>
      </div>

      <div class="input-group">
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="data[cidade]" placeholder="Ex: Palmas" required>
      </div>

      <div class="input-group">
        <label for="estado">Estado</label>
        <input type="text" id="estado" name="data[estado]" placeholder="Ex: Tocantins" required>
      </div>

      <div class="input-group">
        <label for="profissao">Profissão</label>
        <input type="text" id="profissao" name="data[profissao]" placeholder="Ex: Desenvolvedor" required>
      </div>

      <div class="input-group">
        <label for="interesse">Interesse</label>
        <select id="interesse" name="data[interesse]" required>
          <option value="">Selecione uma opção</option>
          <option value="Site">Site</option>
          <option value="Sistema">Sistema</option>
          <option value="Automação">Automação</option>
          <option value="Consultoria">Consultoria</option>
          <option value="Outro">Outro</option>
        </select>
      </div>

      <div class="input-group">
        <label for="data_contato">Data de contato</label>
        <input type="date" id="data_contato" name="data[data_contato]" required>
      </div>

      <div class="input-group full">
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="data[mensagem]" placeholder="Digite uma observação ou mensagem..." required></textarea>
      </div>

      <div class="btn-area">
        <button type="submit" class="dados">Enviar Formulário</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
